manifest:
  defaults:
    remote: urob
    revision: v0.3 # Pin everything to v0.3

  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: caksoylar
      url-base: https://github.com/caksoylar
    - name: urob
      url-base: https://github.com/urob
    - name: dhruvinsh
      url-base: https://github.com/dhruvinsh

  projects:
    - name: zmk
      remote: urob
      import: app/west.yml

    - name: zmk-rgbled-widget
      remote: caksoylar
    - name: zmk-helpers
      remote: urob
    - name: zmk-auto-layer
      remote: urob
    - name: zmk-tri-state
      remote: dhruvinsh
    - name: zmk-adaptive-key
      remote: urob

  self:
    path: config
